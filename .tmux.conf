# Standalone tmux configuration; no external tmux framework required.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB'
set -g history-limit 10000
set -g status-position top

# Preserve the previous Ctrl-a prefix and current directory in new panes.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'

# Dracula-inspired status and pane colors.
set -g status-style 'bg=#282a36,fg=#f8f8f2'
set -g pane-border-style 'fg=#44475a'
set -g pane-active-border-style 'fg=#bd93f9'
set -g message-style 'bg=#44475a,fg=#f8f8f2'
set -g window-status-current-style 'bg=#44475a,fg=#50fa7b'
set -g status-left ' #S | '
set -g status-right ' %H:%M | %d %b '
